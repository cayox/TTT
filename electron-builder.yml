appId: com.cayox.ttt
productName: TTT
copyright: Copyright © 2026 Nico Päller
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  # better-sqlite3 ships prebuilt binaries for every platform; keep the macOS ones, drop sources.
  - '!node_modules/better-sqlite3/{deps,src,build}/**'
  - '!node_modules/better-sqlite3/prebuilds/{win32,linux,linuxmusl}-*'
# Prebuilt binaries are loaded per arch at runtime, so there is nothing to compile.
npmRebuild: false
# better-sqlite3's native binding cannot load from inside the asar archive.
asarUnpack:
  - '**/*.node'
# CoreWLAN helper that reads the Wi-Fi name and asks for Location (npm run helper); src/main/wifi/ssid.ts looks for it here.
extraResources:
  # A real app bundle, so macOS can show the Location prompt for it (see build/make-helper.sh).
  - from: build/TTT Location.app
    to: TTT Location.app
  # Read by Settings -> What's new; the updater shows GitHub's release notes instead.
  - from: CHANGELOG.md
    to: CHANGELOG.md
# ttt:// links (Shortcuts, Focus modes, launchers): see README.
protocols:
  - name: TTT
    schemes: [ttt]
mac:
  category: public.app-category.productivity
  icon: build/icon.icns
  # Ad-hoc signature: required for Apple Silicon to launch the app, but not notarized (see README).
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  extendInfo:
    NSLocationUsageDescription: TTT reads the name of your Wi-Fi network to start and stop tracking at work.
    NSLocationWhenInUseUsageDescription: TTT reads the name of your Wi-Fi network to start and stop tracking at work.
dmg:
  title: ${productName} ${version}
artifactName: ${productName}-${version}-${arch}.${ext}
publish: null
