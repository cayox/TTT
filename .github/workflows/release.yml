name: Build and release

# Every push and pull request is tested and packaged; the DMGs are kept as workflow artifacts.
# Pushing a tag like v1.2.0 also publishes them as a GitHub release.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Package
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: TTT-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      # The app shows these notes before it updates, so a release without them is a bug.
      - name: Release notes from the changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: node build/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # v1.0.0-beta.1 and similar are pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
          # The zips are what the in-app updater downloads; the dmg is for a fresh install.
          files: |
            release/*.dmg
            release/*.zip
