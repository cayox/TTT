<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- TTT (Time Tracking Tool) app icon. build/make-icon.sh turns this into icon.png and icon.icns,
       adding the rounded mask and drop shadow (macOS grid: 824px body, 100px inset). -->
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#3a3731"/>
      <stop offset="1" stop-color="#1b1a17"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c585"/>
      <stop offset="1" stop-color="#b3843f"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3efe7"/>
      <stop offset="1" stop-color="#d9d3c7"/>
    </linearGradient>
  </defs>

  <!-- body -->
  <rect id="body" x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="3"/>

  <!-- progress ring: track + brass arc from 12 o'clock -->
  <circle cx="512" cy="512" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="56"/>
  <path d="M 512 262 A 250 250 0 1 1 277.1 426.5" fill="none" stroke="url(#arc)" stroke-width="56" stroke-linecap="round"/>

  <!-- TTT monogram -->
  <g fill="url(#glyph)">
    <rect x="363" y="452" width="86" height="24" rx="7"/>
    <rect x="394" y="452" width="24" height="120" rx="7"/>
    <rect x="469" y="452" width="86" height="24" rx="7"/>
    <rect x="500" y="452" width="24" height="120" rx="7"/>
    <rect x="575" y="452" width="86" height="24" rx="7"/>
    <rect x="606" y="452" width="24" height="120" rx="7"/>
  </g>
</svg>
